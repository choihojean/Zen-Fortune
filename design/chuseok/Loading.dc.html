<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; }
    a { color: #f4c86a; } a:hover { color: #ffe3a3; }
    @keyframes pound { 0%,100% { transform: rotate(-14deg); } 50% { transform: rotate(10deg); } }
    @keyframes ring { 0% { transform: scale(0.8); opacity: 0.6; } 100% { transform: scale(1.5); opacity: 0; } }
    @keyframes dots { 0%,20% { opacity: 0.2; } 50% { opacity: 1; } 100% { opacity: 0.2; } }
    .mallet { transform-origin: 150px 96px; animation: pound 0.9s ease-in-out infinite; }
    .ring { position: absolute; border-radius: 999px; border: 2px solid rgba(244,200,106,0.5); animation: ring 2.2s ease-out infinite; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: radial-gradient(circle at 50% 40%, #2b3466 0%, #1b2140 55%, #141936 100%); color: #fff3d6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 40px 28px;">
  <div style="position: relative; width: 240px; height: 240px; display: flex; align-items: center; justify-content: center;">
    <div class="ring" style="inset: 20px;"></div>
    <div class="ring" style="inset: 20px; animation-delay: 1.1s;"></div>
    <svg width="220" height="220" viewBox="0 0 220 220" fill="none" style="position: relative;">
      <circle cx="110" cy="110" r="84" fill="#f4c86a"/>
      <circle cx="80" cy="88" r="9" fill="#e9b653"/><circle cx="142" cy="140" r="6" fill="#e9b653"/>
      <rect x="70" y="140" width="80" height="26" rx="10" fill="#7b5a3a"/>
      <ellipse cx="110" cy="140" rx="34" ry="8" fill="#fff8ec"/>
      <path d="M78 124c0-16 8-28 20-28s20 12 20 28c0 12-9 20-20 20s-20-8-20-20z" fill="#fff8ec"/>
      <path d="M86 100c-4-16-2-30 3-38 4 9 3 24 2 36" fill="#fff8ec"/>
      <path d="M110 100c4-16 2-30-3-38-4 9-3 24-2 36" fill="#fff8ec"/>
      <circle cx="93" cy="118" r="2.4" fill="#1b2140"/><circle cx="104" cy="118" r="2.4" fill="#1b2140"/>
      <path d="M96 125c1.5 1.6 4 1.6 5.5 0" stroke="#1b2140" stroke-width="1.8" stroke-linecap="round"/>
      <g class="mallet">
        <rect x="146" y="60" width="8" height="60" rx="4" fill="#7b5a3a"/>
        <rect x="132" y="48" width="36" height="22" rx="8" fill="#b94a30"/>
      </g>
    </svg>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;">
    <p style="margin: 0; font-family: 'Jua', 'Noto Sans KR', sans-serif; font-size: 24px; line-height: 32px; color: #fff3d6;">명절 행동 패턴 분석 중</p>
    <div style="display: flex; gap: 6px;">
      <span style="width: 8px; height: 8px; border-radius: 999px; background: #f4c86a; animation: dots 1.2s infinite;"></span>
      <span style="width: 8px; height: 8px; border-radius: 999px; background: #f4c86a; animation: dots 1.2s infinite 0.2s;"></span>
      <span style="width: 8px; height: 8px; border-radius: 999px; background: #f4c86a; animation: dots 1.2s infinite 0.4s;"></span>
    </div>
    <p style="margin: 6px 0 0; font-size: 13px; color: rgba(255,243,214,0.55); word-break: keep-all;">복주머니 속 결과를 확인하는 중…</p>
  </div>
</div>
</x-dc>
</body>
</html>
